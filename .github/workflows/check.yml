name: Check Shahar Hason shows

on:
  schedule:
    # Every hour. The daily summary is sent by the first run after 20:00 Israel time.
    - cron: "3 * * * *"
  workflow_dispatch: {}  # lets you run it manually from the Actions tab

permissions:
  contents: write  # needed to save seen_shows.json back to the repo

concurrency:
  group: check-shows

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check for new shows
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python check_shows.py

      - name: Save seen shows and run log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_shows.json run_log.json
          git diff --cached --quiet || git commit -q -m "Update seen shows and run log"
          git pull -q --rebase && git push
