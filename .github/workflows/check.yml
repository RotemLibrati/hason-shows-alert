name: Check Shahar Hason shows

on:
  schedule:
    # Twice a day, at about 09:15 and 18:15 Israel time in winter (10:15 and 19:15 in summer). Times are UTC.
    - cron: "13 7 * * *"
    - cron: "13 16 * * *"
  workflow_dispatch: {}  # lets you run it manually from the Actions tab

permissions:
  contents: write  # needed to save seen_shows.json back to the repo

concurrency:
  group: check-shows

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check for new shows
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python check_shows.py

      - name: Save seen shows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_shows.json
          git diff --cached --quiet || git commit -m "Update seen shows"
          git push
